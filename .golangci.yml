version: "1"

run:
  timeout: 5m
  go: '1.23'

linters:
  disable-all: true
  enable:
    - gofmt
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - typecheck

issues:
  exclude-rules:
    - path: _test\.go
      text: "dot-imports"
    - path: \.pb\.go
      text: "dot-imports"